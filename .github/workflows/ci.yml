name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q bot database services webapp config.py main.py

      - name: Generate a throwaway encryption key
        run: echo "ENCRYPTION_MASTER_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      # The remaining tests call live Binance/Jupiter endpoints, which block CI runners.
      - name: Run tests that need no network
        run: >
          python -m unittest -v
          test_webapp
          test_bot.TestUpbitSniper.test_regex_parsing
          test_bot.TestUpbitSniper.test_encryption
